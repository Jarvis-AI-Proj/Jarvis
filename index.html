<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis | AI Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 100; }
        header h1 { font-size: 20px; font-weight: 600; letter-spacing: 4px; color: var(--accent-blue); }
        .h-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .h-btn:hover { background: var(--border); color: #fff; }
        #chat-box { flex-grow: 1; padding: 30px 20%; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 80%; padding: 16px 20px; border-radius: 16px; font-size: 15px; position: relative; }
        .user { align-self: flex-end; background: linear-gradient(135deg, #1f6feb, #094cb3); color: white; }
        .jarvis { align-self: flex-start; background: var(--panel-bg); border: 1px solid var(--border); padding-right: 45px; }
        .input-area { padding: 20px 20%; background: var(--panel-bg); border-top: 1px solid var(--border); }
        .input-box { display: flex; background: #0d1117; border: 1px solid var(--border); border-radius: 14px; padding: 8px 16px; align-items: center; gap: 15px; }
        .img-btn { cursor: pointer; color: var(--text-dim); background: none; border: none; }
        .img-btn:hover { color: var(--accent-blue); }
        #user-input { flex-grow: 1; border: none; background: transparent; padding: 12px; outline: none; color: var(--text-main); font-size: 16px; }
        .send-btn { background: var(--accent-green); border: none; padding: 10px 24px; border-radius: 10px; color: white; cursor: pointer; }
        .tts-btn { background:none; border:none; cursor:pointer; position:absolute; top:12px; right:12px; color: var(--accent-blue); }
        #loading-bar { height: 3px; background: linear-gradient(to right, var(--accent-blue), #bc8cff); width: 0%; transition: width 0.4s; position: absolute; bottom: 0; left: 0; display: none; z-index: 1000; }
        #mode-overlay { display:none; position: absolute; bottom: 85px; left: 50px; background: #161b22; border: 1px solid var(--border); border-radius: 12px; width: 320px; padding: 8px; z-index: 200; }
        .mode-item { padding: 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .mode-item:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
<header><h1>JARVIS</h1><div class="header-btns"><button class="h-btn" onclick="loadChat()">YÜKLE</button><button class="h-btn" onclick="clearChat()">SIFIRLA</button></div><div id="loading-bar"></div></header>
<div id="chat-box"></div>
<div class="input-area">
    <div class="input-box">
        <button class="img-btn" onclick="triggerImageGen()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></button>
        <div style="position: relative;">
            <button class="img-btn" onclick="toggleModeOverlay()"><svg id="pen-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
            <div id="mode-overlay">
                <div class="mode-item" onclick="selectMode('drawing')"><strong>Çizim modu</strong></div>
                <div class="mode-item" onclick="selectMode('editing')"><strong>Düzenleme modu</strong></div>
                <div class="mode-item" onclick="selectMode('music')"><strong>Müzik modu</strong></div>
            </div>
        </div>
        <input type="text" id="user-input" placeholder="Aklınızda ne var?" autocomplete="off">
        <button class="send-btn" onclick="handleSend()">GÖNDER</button>
    </div>
</div>
<script>
    const chatBox = document.getElementById('chat-box'), userInput = document.getElementById('user-input');
    // SABİT ABSOLUTE URL'LER (ASLA DEĞİŞMEYECEK)
    const API_URL = "https://jarvis-omega-eosin.vercel.app/api/chat";
    const IMG_API_URL = "https://jarvis-kappa-silk.vercel.app/api/generate";
    const EDIT_API_URL = "https://jarvis-kappa-silk.vercel.app/api/edit";
    const MUSIC_API_URL = "https://jarvis-kappa-silk.vercel.app/api/music";
    const TTS_API_URL = "https://jarvis-kappa-silk.vercel.app/api/tts";

    let history = [], activeMode = null;

    function clean(t) { return t.replace(/[^a-zA-ZçÇğĞıİöÖşŞüÜ0-9\s.,!?:;'"\-]/g, '').trim(); }

    function speak(text) {
        if (!window.speechSynthesis) return; window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = window.speechSynthesis.getVoices();
        const tr = v.find(s => s.lang.includes('tr')); 
        if (tr) u.voice = tr; u.lang = 'tr-TR';
        window.speechSynthesis.speak(u);
    }

    function addMessage(role, text) {
        const div = document.createElement('div'); div.className = `msg ${role}`;
        if (role === 'jarvis') {
            const cleaned = clean(text);
            div.innerHTML = cleaned.replace(/\n/g, '<br>');
            const btn = document.createElement('button'); btn.className = 'tts-btn';
            btn.innerHTML = 'DİNLE';
            btn.onclick = () => speak(cleaned);
            div.appendChild(btn);
        } else { div.textContent = text; }
        chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
        const val = userInput.value.trim(); if (!val) return;
        addMessage('user', val); userInput.value = ''; history.push({ role: "user", content: val });
        
        let url = API_URL;
        let body = { messages: history, model: "llama-3.3" };

        if (activeMode === 'music') { url = MUSIC_API_URL; body = { prompt: val }; }
        else if (activeMode === 'drawing') { url = IMG_API_URL; body = { inputs: val }; }

        try {
            const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
            const data = await res.json();
            if (activeMode === 'music' || activeMode === 'drawing') {
                addMessage('jarvis', "İşlem tamamlandı, indirilebilir dosyalar oluşturuldu.");
            } else {
                addMessage('jarvis', data.choices[0].message.content);
                history.push({ role: "assistant", content: data.choices[0].message.content });
            }
        } catch (e) { addMessage('jarvis', "Bağlantı hatası: " + e.message); }
    }

    function toggleModeOverlay() { const o = document.getElementById('mode-overlay'); o.style.display = (o.style.display === 'none') ? 'block' : 'none'; }
    function selectMode(m) { activeMode = m; userInput.placeholder = `${m.toUpperCase()} MODU AKTİF`; document.getElementById('mode-overlay').style.display='none'; }
    window.onload = () => addMessage('jarvis', 'Merhaba. Ben Jarvis.');
</script>
</body>
</html>
